name: Run Cyber Cafe Bot (Hourly Restart)

on:
  # External cron (cron-job.org) workflow_dispatch se trigger karega
  workflow_dispatch:

concurrency:
  group: telegram-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    # Job-level timeout 70 min — taaki 65m wala command safely pura ho sake
    timeout-minutes: 70

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run bot (65 min)
        env:
          BOT_TOKEN:     ${{ secrets.BOT_TOKEN }}
          UPI_ID:        ${{ secrets.UPI_ID }}
          PAYEE_NAME:    ${{ secrets.PAYEE_NAME }}
          ADMIN_CHAT_ID: ${{ secrets.ADMIN_CHAT_ID }}
        # 65 min baad gracefully exit — agle trigger ke pending me rehne ke liye
        run: timeout 65m python cyber_cafe_bot.py || true
