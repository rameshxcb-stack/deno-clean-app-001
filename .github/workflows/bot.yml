name: Cyber Cafe Telegram Bot

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cyber-cafe-telegram-bot
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
      TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
      TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
      
      # 🔽 यहाँ हमने GitHub के plural सेक्रेट को Singular variable में मैप कर दिया है
      ADMIN_USER_ID: ${{ secrets.ADMIN_USER_IDS }}
      OWNER_USER_ID: ${{ secrets.OWNER_USER_IDS }}
      
      # पुराने वाले भी रहने दें (अगर कोड में कहीं और इस्तेमाल हो रहे हों)
      ADMIN_USER_IDS: ${{ secrets.ADMIN_USER_IDS }}
      OWNER_USER_IDS: ${{ secrets.OWNER_USER_IDS }}
      
      ADMIN_CHAT_ID: ${{ secrets.ADMIN_CHAT_ID }}
      ADMIN_ALERT_CHAT_ID: ${{ secrets.ADMIN_ALERT_CHAT_ID }}
      UPI_ID: ${{ secrets.UPI_ID }}
      PAYEE_NAME: ${{ secrets.PAYEE_NAME }}
      PAYMENT_AUTO_VERIFY_ENABLED: ${{ vars.PAYMENT_AUTO_VERIFY_ENABLED }}
      PAYMENT_PROVIDER_ALLOWED_HOSTS: ${{ vars.PAYMENT_PROVIDER_ALLOWED_HOSTS }}
      PAYMENT_AUTO_VERIFY_TIMEOUT: "10"
      DB_PATH: cyber_cafe.sqlite3
      BACKUP_DIR: backups
      URGENT_FEE: "50"
      DEFAULT_SLA_HOURS: "24"
      MAX_UPLOAD_MB: "15"
      LOYALTY_POINTS_PER_100: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Validate required secrets
        shell: bash
        run: |
          # यहाँ भी हमने ADMIN_USER_ID चेक करने के लिए सेट कर दिया है
          for name in BOT_TOKEN TURSO_DATABASE_URL TURSO_AUTH_TOKEN ADMIN_USER_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing required GitHub Actions secret: $name"
              exit 1
            fi
          done

      - name: Check Python syntax
        run: python -m py_compile cyber_cafe_bot.py

      - name: Run Telegram bot (65 min, graceful shutdown)
        shell: bash
        run: |
          set +e
          timeout --signal=INT --kill-after=30s 65m python -u cyber_cafe_bot.py
          rc=$?
          if [ "$rc" -eq 124 ] || [ "$rc" -eq 130 ] || [ "$rc" -eq 143 ]; then
            echo "Bot stopped at the planned 65-minute runtime limit (graceful)."
            exit 0
          fi
          exit "$rc"
